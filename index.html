<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>bruh</title>
  <meta name="theme-color" content="#120e14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <!-- JSZip builds .zip files inside the browser. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<main class="shell">
  <header class="top">
    <h1 class="mark">bruh</h1>
    <button class="btn ghost small" id="lock">Lock</button>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-save" aria-controls="panel-save" aria-selected="true">save</button>
    <button role="tab" id="tab-resize" aria-controls="panel-resize" aria-selected="false">resize</button>
  </nav>

  <!-- ===================== Save ===================== -->
  <section id="panel-save" role="tabpanel" aria-labelledby="tab-save">
    <textarea id="links" aria-label="Links" placeholder="Paste links here. One, fifty, or a messy block of text."></textarea>
    <button class="btn primary" id="find">Find media</button>
    <p class="status" id="status" aria-live="polite"></p>
    <ul class="rows" id="results"></ul>
    <div class="actions" id="saveActions" hidden>
      <button class="btn primary" id="share">Save to Photos</button>
      <button class="btn ghost" id="zip">Download zip</button>
    </div>
    <a class="quiet" href="/shortcut.html">Save from any app's Share button</a>
  </section>

  <!-- ===================== Resize ===================== -->
  <section id="panel-resize" role="tabpanel" aria-labelledby="tab-resize" hidden>
    <p class="hint">Uses the images you found in save, plus any you add here. Videos are skipped, and nothing leaves your phone.</p>

    <label class="drop" id="dropLabel">
      <input id="upload" type="file" accept="image/*" multiple>
      <span id="dropText">Add your own images</span>
    </label>

    <fieldset class="group">
      <legend>Size</legend>
      <div class="pills">
        <input type="radio" name="size" id="s1" value="1280x720" checked><label for="s1">16:9 <small>1280 × 720</small></label>
        <input type="radio" name="size" id="s2" value="1920x1080"><label for="s2">16:9 HD <small>1920 × 1080</small></label>
        <input type="radio" name="size" id="s3" value="1080x1920"><label for="s3">9:16 <small>1080 × 1920</small></label>
        <input type="radio" name="size" id="s4" value="1080x1080"><label for="s4">1:1 <small>1080 × 1080</small></label>
        <input type="radio" name="size" id="s5" value="1080x1350"><label for="s5">4:5 <small>1080 × 1350</small></label>
      </div>
    </fieldset>

    <fieldset class="group">
      <legend>Fit</legend>
      <div class="pills">
        <input type="radio" name="fit" id="f1" value="crop" checked><label for="f1">Crop to fill</label>
        <input type="radio" name="fit" id="f2" value="blur"><label for="f2">Blurred background</label>
      </div>
    </fieldset>

    <button class="btn primary" id="resize">Resize images</button>
    <p class="status" id="resizeStatus" aria-live="polite"></p>
    <div class="preview" id="preview"></div>
    <div class="actions" id="resizeActions" hidden>
      <button class="btn primary" id="resizeShare">Save to Photos</button>
      <button class="btn ghost" id="resizeZip">Download zip</button>
    </div>
  </section>
</main>

<script>
// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
// document.getElementById finds an element on the page by its id="...".
const $ = (id) => document.getElementById(id);
// The currently ticked radio button in a group, e.g. picked('size') -> "1280x720".
const picked = (name) => document.querySelector(`input[name="${name}"]:checked`).value;

// Show a message under a button. Errors get the "bad" colour.
function say(el, text, isError = false) {
  el.textContent = text;
  el.classList.toggle('bad', isError);
}

// ---- Tabs: show one panel, hide the other --------------------------------
for (const tab of document.querySelectorAll('[role="tab"]')) {
  tab.addEventListener('click', () => {
    for (const other of document.querySelectorAll('[role="tab"]')) {
      const selected = other === tab;
      other.setAttribute('aria-selected', String(selected));
      $(other.getAttribute('aria-controls')).hidden = !selected;
    }
  });
}

// ---- Lock: you're logged in by a cookie; this clears it ------------------
$('lock').addEventListener('click', async () => {
  await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ logout: true }),
  });
  location.reload(); // no cookie any more, so the lock screen shows
});

// Items found by "Find media": { type, mediaUrl, filename }.
let found = [];
// Resized images ready to save: File objects.
let resized = [];

// Pull every web link out of whatever text was pasted.
function extractLinks(text) {
  return [...new Set(text.match(/https?:\/\/[^\s"'<>]+/gi) || [])];
}

// Address of our relay for one file (see api/file.js for why we relay).
function fileUrl(item) {
  return `/api/file?${new URLSearchParams({ url: item.mediaUrl, name: item.filename })}`;
}

// Download items through the relay one by one, reporting progress.
// Returns File objects (a File is a Blob, i.e. raw data, plus a name).
async function fetchFiles(items, statusEl) {
  const files = [];
  for (let i = 0; i < items.length; i++) {
    say(statusEl, `Downloading ${i + 1} of ${items.length}`);
    const response = await fetch(fileUrl(items[i]));
    if (!response.ok) throw new Error(`Couldn't download ${items[i].filename}`);
    const blob = await response.blob();
    files.push(new File([blob], items[i].filename, { type: blob.type }));
  }
  return files;
}

// Save a list of Files as one .zip.
async function saveZip(files, statusEl, label) {
  const zip = new JSZip();
  for (const f of files) zip.file(f.name, f);
  say(statusEl, 'Zipping');
  const blob = await zip.generateAsync({ type: 'blob' });
  // Make a temporary in-memory link and "click" it to start the download.
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${label}-${Date.now()}.zip`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  say(statusEl, `Downloaded ${files.length} file(s) as a zip`);
}

// Open the phone's share sheet so you can tap "Save to Photos".
async function shareFiles(files, statusEl) {
  if (!navigator.canShare || !navigator.canShare({ files })) {
    throw new Error("This browser can't save straight to Photos. Use Download zip instead.");
  }
  say(statusEl, 'Tap "Save Images" or "Save Videos" in the share sheet');
  await navigator.share({ files });
}

// Run an async button action: disable the button meanwhile, show errors.
function onClick(button, statusEl, action) {
  button.addEventListener('click', async () => {
    button.disabled = true;
    try {
      await action();
    } catch (err) {
      // AbortError = the share sheet was simply closed. Not a real error.
      if (err.name !== 'AbortError') say(statusEl, err.message, true);
    } finally {
      button.disabled = false;
    }
  });
}

// ---------------------------------------------------------------------------
// Save: find media in the pasted links
// ---------------------------------------------------------------------------
onClick($('find'), $('status'), async () => {
  const links = extractLinks($('links').value);
  if (links.length === 0) throw new Error('No links in there. Paste at least one https:// link.');

  $('saveActions').hidden = true;
  $('results').innerHTML = '';
  say($('status'), `Looking through ${links.length} link(s)`);

  // Ask our server to find the media. "await" waits for the answer.
  const response = await fetch('/api/resolve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ links }),
  });
  if (response.status === 401) { location.reload(); return; } // logged out: show lock
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || 'The server had a problem. Try again.');

  // One link can produce many items (a board, a multi-photo post...).
  // flatMap turns [[a, b], [c]] into [a, b, c].
  found = data.results.flatMap((r) => (r.ok ? r.items : []));
  renderResults(data.results);
  const failed = data.results.filter((r) => !r.ok).length;
  say($('status'), `Found ${found.length} file(s)` + (failed ? `. ${failed} link(s) didn't work.` : ''));
  $('saveActions').hidden = found.length === 0;
});

// Draw one row per item, plus one row per failed link.
function renderResults(results) {
  const addRow = (title, detail, item) => {
    const li = document.createElement('li');
    if (!item) li.className = 'fail';
    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = '<div class="name"></div><div class="detail"></div>';
    // textContent (not innerHTML) so pasted text can never inject HTML.
    info.querySelector('.name').textContent = title;
    info.querySelector('.detail').textContent = detail;
    li.appendChild(info);
    if (item) {
      const a = document.createElement('a');
      a.href = fileUrl(item);
      a.textContent = 'Save';
      li.appendChild(a);
    }
    $('results').appendChild(li);
  };
  for (const r of results) {
    if (!r.ok) addRow(r.link, r.error, null);
    else for (const item of r.items) addRow(item.filename, item.type, item);
  }
}

onClick($('zip'), $('status'), async () => saveZip(await fetchFiles(found, $('status')), $('status'), 'media'));
onClick($('share'), $('status'), async () => shareFiles(await fetchFiles(found, $('status')), $('status')));

// ---------------------------------------------------------------------------
// Resize & crop (all done on your phone; nothing is uploaded)
// ---------------------------------------------------------------------------
// Show how many images were picked in the drop zone.
$('upload').addEventListener('change', () => {
  const n = $('upload').files.length;
  $('dropText').textContent = n ? `${n} image(s) added` : 'Add your own images';
});

// Draw one image onto a canvas of the chosen size and return a JPEG File.
async function resizeOne(file, width, height, mode) {
  const img = await createImageBitmap(file); // decode the image
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  // "cover" fills the whole canvas (edges get cut off);
  // "contain" fits the whole image inside (leaves empty bands).
  const cover = Math.max(width / img.width, height / img.height);
  const contain = Math.min(width / img.width, height / img.height);
  const drawCentered = (scale) => {
    const w = img.width * scale;
    const h = img.height * scale;
    ctx.drawImage(img, (width - w) / 2, (height - h) / 2, w, h);
  };

  if (mode === 'crop') {
    drawCentered(cover);
  } else {
    // Blurred, darkened copy filling the background, sharp copy on top.
    ctx.filter = 'blur(40px) brightness(0.7)';
    drawCentered(cover * 1.1);
    ctx.filter = 'none';
    drawCentered(contain);
  }

  // toBlob uses a callback, so wrap it in a Promise to be able to await it.
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.92));
  const base = file.name.replace(/\.[^.]+$/, '');
  return new File([blob], `${base}-${width}x${height}.jpg`, { type: 'image/jpeg' });
}

onClick($('resize'), $('resizeStatus'), async () => {
  const status = $('resizeStatus');
  const foundImages = found.filter((item) => item.type === 'image');
  const fromLinks = foundImages.length ? await fetchFiles(foundImages, status) : [];
  const sources = [...fromLinks, ...$('upload').files];
  if (sources.length === 0) throw new Error('No images yet. Find some in save, or add your own above.');

  const [width, height] = picked('size').split('x').map(Number); // "1280x720" -> [1280, 720]
  resized = [];
  $('preview').innerHTML = '';
  $('resizeActions').hidden = true;
  for (let i = 0; i < sources.length; i++) {
    say(status, `Resizing ${i + 1} of ${sources.length}`);
    const out = await resizeOne(sources[i], width, height, picked('fit'));
    resized.push(out);
    const thumb = document.createElement('img');
    thumb.src = URL.createObjectURL(out);
    thumb.alt = out.name;
    $('preview').appendChild(thumb);
  }
  say(status, `Resized ${resized.length} image(s) to ${width} × ${height}`);
  $('resizeActions').hidden = false;
});

onClick($('resizeZip'), $('resizeStatus'), () => saveZip(resized, $('resizeStatus'), 'resized'));
onClick($('resizeShare'), $('resizeStatus'), () => shareFiles(resized, $('resizeStatus')));
</script>
</body>
</html>
